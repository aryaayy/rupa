[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["../node_modules"]
remappings = ["@openzeppelin/contracts/=../node_modules/@openzeppelin/contracts/"]
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read", path = "./test/vectors" }]

[profile.default.fuzz]
runs = 256

[fmt]
line_length = 110
