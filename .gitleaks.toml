title = "Rupa secret scanning"

[extend]
useDefault = true

[allowlist]
description = "Dependencies, build output, and public contract addresses"
paths = ['''(^|/)node_modules/''', '''(^|/)dist/''', '''^contracts/(out|cache)/''', '''^\.git/''']
regexTarget = "secret"
regexes = ['''^0x[0-9a-fA-F]{40}$''']
