title = "Rupa secret scanning"

[extend]
useDefault = true

[[allowlists]]
description = "Installed dependencies and generated output"
paths = ['''(^|/)node_modules/''', '''(^|/)dist/''', '''^contracts/(out|cache)/''', '''^\.git/''']

[[allowlists]]
description = "Public Monad testnet contract addresses"
regexTarget = "match"
regexes = ['''0x[0-9a-fA-F]{40}\b''']
paths = ['''^deployments/.*\.json$''', '''^packages/sdk/src/deployment\.ts$''']
condition = "AND"
